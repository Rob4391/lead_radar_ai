name: CI - Prisma + Tests (backend)

on:
  pull_request:
    branches: [ main ]

jobs:
  prisma:
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd backend
          # Use npm ci when a lockfile exists for reproducible installs,
          # otherwise fall back to npm install (useful for branches without lockfile).
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Start Postgres (service)
        run: echo "Postgres launched as service (see job services)"
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgres://lead_radar:changeme@127.0.0.1:5432/lead_radar
        run: |
          cd backend
          npx prisma generate
      - name: Push schema and seed
        env:
          DATABASE_URL: postgres://lead_radar:changeme@127.0.0.1:5432/lead_radar
        run: |
          cd backend
          npx prisma db push --accept-data-loss
          node -e "require('@prisma/client');console.log('prisma client available')"
      - name: ADMIN_API_KEY placeholder check
        run: |
          if [ -z "${ADMIN_API_KEY}" ]; then
            echo "ADMIN_API_KEY not set (placeholder)"
          else
            echo "ADMIN_API_KEY is set (will be used by authenticated tests)"
          fi
      - name: Run lint/tests (placeholder)
        run: |
          echo "No tests configured yet; add integration tests to validate endpoints"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lead_radar
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lead_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
