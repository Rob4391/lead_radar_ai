name: CI - Backend + Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      DATABASE_URL: postgres://lead_radar:changeme@127.0.0.1:5432/lead_radar
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lead_radar
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lead_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: |
          # Use npm ci when a lockfile exists for reproducible installs,
          # otherwise fall back to npm install (useful for branches without lockfile).
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Push schema
        working-directory: backend
        run: npx prisma db push --accept-data-loss
      - name: Typecheck + build
        working-directory: backend
        run: npm run build
      - name: Run unit tests
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit
