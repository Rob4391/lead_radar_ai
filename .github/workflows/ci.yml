name: CI

on:
  push:
    branches: [ main, phase-1, phase-2, phase-4 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Install package
        run: |
          pip install -e .
      - name: Run integration tests dependencies
        run: |
          # ensure optional test tools are available
          pip install responses
      - name: Run tests
        run: |
          pytest -q
