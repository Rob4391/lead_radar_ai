name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies (if Python tests present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
          else
            echo "No requirements.txt found — skipping Python dependency install"
          fi
      - name: Install package (if Python package present)
        run: |
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            pip install -e . || true
          else
            echo "No Python package to install"
          fi
      - name: Run integration tests dependencies (if Python tests present)
        run: |
          if [ -f requirements.txt ]; then
            pip install responses
          else
            echo "Skipping optional Python test tools"
          fi
      - name: Run tests (if Python tests present)
        run: |
          if [ -f requirements.txt ] || [ -d tests ] || ls | grep -q "pytest"; then
            pytest -q || true
          else
            echo "No Python tests detected — skipping"
          fi
