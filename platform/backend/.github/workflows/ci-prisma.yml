name: CI - Prisma + Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  prisma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd platform/backend
          npm ci
      - name: Generate Prisma client
        run: |
          cd platform/backend
          npx prisma generate
      - name: Run lint/tests (placeholder)
        run: |
          echo "No tests configured; consider adding integration tests"
