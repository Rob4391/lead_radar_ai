version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lead_radar
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: lead_radar
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - ./phase-5-stack/backend:/usr/src/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3001:3001'
    depends_on:
      - db

  frontend:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - ./phase-5-stack/frontend:/usr/src/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db-data:
